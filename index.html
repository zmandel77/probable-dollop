<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Worcester</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Courier+Prime:ital,wght@0,400;0,700;1,400&display=swap');

*{margin:0;padding:0;box-sizing:border-box;}
body{
  min-height:100vh;
  font-family:'Courier Prime',monospace;
  background:#f2ede4;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:2rem;
}

.widget{
  display:flex;
  align-items:center;
  gap:3rem;
  flex-wrap:wrap;
}

.clock-block{}
.clock-date{
  font-size:11px;letter-spacing:.15em;text-transform:uppercase;
  color:#8a7f70;margin-bottom:.3rem;
}
.clock-time{
  font-size:64px;line-height:1;font-weight:700;
  color:#2a2318;letter-spacing:-.01em;
}
.clock-ampm{
  font-size:20px;font-weight:400;margin-left:6px;
  color:#8a7f70;vertical-align:super;font-size:14px;
}
.clock-loc{
  font-size:10px;letter-spacing:.13em;text-transform:uppercase;
  color:#a8998a;margin-top:.4rem;
}

.divider{
  width:1px;height:80px;
  background:rgba(42,35,24,0.12);
  flex-shrink:0;
}

.weather-block{
  display:flex;align-items:center;gap:1.2rem;
}
.wx-temp{
  font-size:48px;font-weight:700;
  color:#2a2318;letter-spacing:-.02em;display:block;
}
.wx-desc{
  font-size:12px;color:#8a7f70;font-style:italic;
  margin-top:.2rem;letter-spacing:.02em;
}
</style>
</head>
<body>

<div class="widget">

  <div class="clock-block">
    <div class="clock-date" id="cl-date">—</div>
    <div class="clock-time" id="cl-time">—<span class="clock-ampm" id="cl-ampm"></span></div>
    <div class="clock-loc">Worcester, MA</div>
  </div>

  <div class="divider"></div>

  <div class="weather-block">
    <svg id="wx-icon" width="72" height="72" viewBox="0 0 72 72" fill="none" xmlns="http://www.w3.org/2000/svg"></svg>
    <div>
      <span class="wx-temp" id="wx-temp">—</span>
      <span class="wx-desc" id="wx-desc">loading...</span>
    </div>
  </div>

</div>

<script>
/* CLOCK */
function tick(){
  const n=new Date(),tz='America/New_York';
  const p=new Intl.DateTimeFormat('en-US',{timeZone:tz,hour:'numeric',minute:'2-digit',second:'2-digit',hour12:true}).formatToParts(n);
  const g=t=>p.find(x=>x.type===t)?.value||'';
  document.getElementById('cl-date').textContent=
    new Intl.DateTimeFormat('en-US',{timeZone:tz,weekday:'long',month:'long',day:'numeric',year:'numeric'}).format(n);
  document.getElementById('cl-time').childNodes[0].nodeValue=g('hour')+':'+g('minute')+':'+g('second');
  document.getElementById('cl-ampm').textContent=' '+g('dayperiod').toLowerCase();
}
tick();setInterval(tick,1000);

/* WEATHER ICONS (warm ink palette for ecru bg) */
const NS='http://www.w3.org/2000/svg';
const INK='#4a3f30', INKL='#8a7f70', INKLL='#c8bfb0';
function el(tag,a){const e=document.createElementNS(NS,tag);for(const k in a)e.setAttribute(k,a[k]);return e;}
function anim(e,attr,vals,dur,delay){
  const a=el('animate',{attributeName:attr,values:vals,dur:dur+'s',begin:(delay||0)+'s',repeatCount:'indefinite',calcMode:'easeInOut'});
  e.appendChild(a);return e;
}

function drawIcon(svg,code,isNight){
  svg.innerHTML='';
  const type=wxType(code,isNight);
  const cx=36,cy=36;

  if(type==='night'){
    /* crescent moon */
    const moon=el('path',{d:'M44 24 A14 14 0 1 0 44 48 A10 10 0 1 1 44 24',fill:INK,opacity:'0.85'});
    anim(moon,'opacity','0.85;0.6;0.85',4,0);svg.appendChild(moon);
    [[14,14],[58,10],[10,52],[60,50],[20,38]].forEach(([x,y])=>{
      const s=el('circle',{cx:x,cy:y,r:'1.2',fill:INKL,opacity:'0'});anim(s,'opacity','0;0.7;0',2.5,Math.random()*2);svg.appendChild(s);
    });
  } else if(type==='clear'){
    /* sun */
    const sun=el('circle',{cx,cy,r:'13',fill:INK,opacity:'0.9'});anim(sun,'r','13;15;13',4,0);svg.appendChild(sun);
    [0,45,90,135,180,225,270,315].forEach((a,i)=>{
      const r=a*Math.PI/180;
      const ray=el('line',{x1:cx+18*Math.cos(r),y1:cy+18*Math.sin(r),x2:cx+24*Math.cos(r),y2:cy+24*Math.sin(r),stroke:INK,'stroke-width':'2','stroke-linecap':'round'});
      anim(ray,'opacity','0.8;0.2;0.8',3.5,i*0.4);svg.appendChild(ray);
    });
  } else if(type==='partly'){
    const sun=el('circle',{cx:24,cy:26,r:'10',fill:INKL,opacity:'0.7'});anim(sun,'cy','26;23;26',3.5,0);svg.appendChild(sun);
    cloud(svg,40,46,1);
  } else if(type==='cloudy'){
    cloud(svg,36,38,0.4);cloud(svg,36,48,1);
  } else if(type==='rain'){
    cloud(svg,36,38,1);
    [[26,52,0],[34,57,0.3],[42,52,0.6],[30,62,0.9]].forEach(([x,y,d])=>{
      const ln=el('line',{x1:x,y1:y,x2:x-4,y2:y+8,stroke:INKL,'stroke-width':'1.3','stroke-linecap':'round',opacity:'0'});
      anim(ln,'opacity','0;0.8;0',1.1,d);svg.appendChild(ln);
    });
  } else if(type==='snow'){
    cloud(svg,36,38,1);
    [[26,54,0],[36,59,0.5],[46,54,1]].forEach(([x,y,d])=>{
      const g=el('g');
      [0,60,120].forEach(a=>{const r=a*Math.PI/180;g.appendChild(el('line',{x1:x-5*Math.cos(r),y1:y-5*Math.sin(r),x2:x+5*Math.cos(r),y2:y+5*Math.sin(r),stroke:INKL,'stroke-width':'1.1','stroke-linecap':'round'}));});
      anim(g,'opacity','0;0.9;0',2,d);svg.appendChild(g);
    });
  } else if(type==='fog'){
    [[8,28,52,0],[8,36,44,0.4],[8,44,50,0.8],[8,52,38,1.2]].forEach(([x,y,w,d])=>{
      const ln=el('line',{x1:x,y1:y,x2:x+w,y2:y,stroke:INKL,'stroke-width':'2','stroke-linecap':'round',opacity:'0.5'});
      anim(ln,'opacity','0.5;0.15;0.5',3.5,d);svg.appendChild(ln);
    });
  } else if(type==='thunder'){
    cloud(svg,36,36,1);
    const bolt=el('polygon',{points:'40,18 32,34 38,34 28,56 46,30 40,30 46,18',fill:INK,opacity:'0'});
    anim(bolt,'opacity','0;0;0;1;0.7;0;0;0;0.9;0',3.5,0);svg.appendChild(bolt);
  }
}

function cloud(svg,cx,cy,op){
  const g=el('g',{opacity:op});
  g.appendChild(el('ellipse',{cx,cy,rx:'16',ry:'9',fill:INK}));
  g.appendChild(el('ellipse',{cx:cx-11,cy:cy+4,rx:'10',ry:'8',fill:INK}));
  g.appendChild(el('ellipse',{cx:cx+11,cy:cy+4,rx:'9',ry:'7',fill:INK}));
  const mv=el('animateTransform',{attributeName:'transform',type:'translate',values:'0,0;3,0;0,0',dur:'5s',begin:'0s',repeatCount:'indefinite',additive:'sum'});
  g.appendChild(mv);svg.appendChild(g);
}

const WX_CODES={0:'clear',1:'mainly clear',2:'partly cloudy',3:'overcast',45:'fog',48:'fog',51:'drizzle',53:'drizzle',55:'drizzle',61:'rain',63:'rain',65:'rain',71:'snow',73:'snow',75:'snow',80:'showers',81:'showers',82:'showers',95:'thunderstorm',96:'thunderstorm',99:'thunderstorm'};
function wxType(code,isNight){
  if(isNight&&code<=1)return'night';
  if(code<=1)return'clear';if(code===2)return'partly';if(code===3)return'cloudy';
  if(code===45||code===48)return'fog';
  if(code>=51&&code<=65)return'rain';if(code>=71&&code<=75)return'snow';
  if(code>=80&&code<=82)return'rain';if(code>=95)return'thunder';return'cloudy';
}

fetch('https://api.open-meteo.com/v1/forecast?latitude=42.2626&longitude=-71.8023&current_weather=true&temperature_unit=fahrenheit')
.then(r=>r.json()).then(d=>{
  const c=d.current_weather;
  document.getElementById('wx-temp').textContent=Math.round(c.temperature)+'°F';
  document.getElementById('wx-desc').textContent=WX_CODES[c.weathercode]||'';
  drawIcon(document.getElementById('wx-icon'),c.weathercode,c.is_day===0);
}).catch(()=>{document.getElementById('wx-desc').textContent='unavailable';});
</script>
</body>
</html>
