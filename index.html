<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Worcester Dashboard</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Courier+Prime:ital,wght@0,400;0,700;1,400&display=swap');

*{margin:0;padding:0;box-sizing:border-box;}
:root{
  --font:'Courier Prime',monospace;
  --ink:#1a1a2e;
  --muted:#6a7a8a;
  --border:rgba(255,255,255,0.28);
  --card:rgba(255,255,255,0.22);
  --card-hover:rgba(255,255,255,0.32);
  --radius:14px;
  --shadow:0 4px 24px rgba(0,0,0,0.10);
}

html{scroll-behavior:smooth;}
body{
  min-height:100vh;
  font-family:var(--font);
  color:var(--ink);
  background:var(--grad,#a8c8e8);
  transition:background 3s ease;
}

/* ── gradient engine ── */
/* set via JS based on time of day */

/* ── layout ── */
.dashboard{
  max-width:680px;
  margin:0 auto;
  padding:2rem 1.2rem 6rem;
  display:flex;
  flex-direction:column;
  gap:1.4rem;
}

/* ── card base ── */
.card{
  background:var(--card);
  backdrop-filter:blur(14px);
  -webkit-backdrop-filter:blur(14px);
  border:1px solid var(--border);
  border-radius:var(--radius);
  box-shadow:var(--shadow);
  padding:1.4rem 1.6rem;
  transition:background .2s;
}
.card:hover{background:var(--card-hover);}

.card-label{
  font-size:10px;letter-spacing:.13em;text-transform:uppercase;
  color:rgba(26,26,46,0.55);margin-bottom:.8rem;
}

/* ══════════════════════════════════════
   § 1  WEATHER + CLOCK
══════════════════════════════════════ */
#scene{
  position:fixed;inset:0;
  pointer-events:none;z-index:0;
  overflow:hidden;
}
.dashboard{position:relative;z-index:1;}

.wc-grid{display:flex;gap:1.4rem;align-items:center;flex-wrap:wrap;}
.clock-block{}
.clock-date{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:rgba(26,26,46,0.6);}
.clock-time{font-size:52px;line-height:1;font-weight:700;}
.clock-ampm{font-size:18px;font-weight:400;margin-left:4px;color:rgba(26,26,46,0.6);}
.clock-loc{font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:rgba(26,26,46,0.5);margin-top:2px;}
.wc-divider{width:1px;height:60px;background:var(--border);flex-shrink:0;}
.weather-block{display:flex;align-items:center;gap:.9rem;}
#wx-icon{flex-shrink:0;}
.wx-temp{font-size:32px;font-weight:700;display:block;}
.wx-desc{font-size:12px;color:rgba(26,26,46,0.6);font-style:italic;margin-top:2px;}

/* ══════════════════════════════════════
   § 2  DAILY PLANNER
══════════════════════════════════════ */
.planner-nav{
  display:flex;align-items:center;justify-content:space-between;
  margin-bottom:1rem;
}
.planner-nav-title{font-size:14px;font-weight:700;}
.planner-nav-arrows{display:flex;gap:.4rem;}
.nav-btn{
  font-family:var(--font);font-size:13px;
  background:rgba(255,255,255,0.25);border:1px solid var(--border);
  border-radius:6px;padding:3px 9px;cursor:pointer;color:var(--ink);
  transition:background .15s;
}
.nav-btn:hover{background:rgba(255,255,255,0.4);}

/* week strip */
.week-strip{
  display:flex;gap:.3rem;margin-bottom:1.2rem;overflow-x:auto;
  padding-bottom:4px;
}
.week-strip::-webkit-scrollbar{height:3px;}
.week-strip::-webkit-scrollbar-thumb{background:rgba(255,255,255,0.3);border-radius:3px;}
.week-day{
  flex-shrink:0;width:44px;
  display:flex;flex-direction:column;align-items:center;gap:3px;
  padding:6px 4px;border-radius:10px;cursor:pointer;
  border:1px solid transparent;transition:all .15s;
}
.week-day:hover{background:rgba(255,255,255,0.25);}
.week-day.today{background:rgba(255,255,255,0.35);border-color:var(--border);}
.week-day.has-event::after{content:'';width:5px;height:5px;border-radius:50%;background:rgba(26,26,46,0.4);display:block;}
.wd-name{font-size:9px;letter-spacing:.08em;text-transform:uppercase;color:rgba(26,26,46,0.55);}
.wd-num{font-size:15px;font-weight:700;}
.wd-month{font-size:9px;color:rgba(26,26,46,0.45);}

/* split: time blocks + task list */
.planner-split{display:grid;grid-template-columns:1fr 1fr;gap:1rem;}
@media(max-width:480px){.planner-split{grid-template-columns:1fr;}}

.planner-col-label{font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:rgba(26,26,46,0.5);margin-bottom:.5rem;}

/* time blocks */
.time-blocks{display:flex;flex-direction:column;gap:.3rem;}
.time-block{
  display:flex;align-items:flex-start;gap:.6rem;
  padding:.45rem .6rem;border-radius:8px;
  background:rgba(255,255,255,0.18);
  border:1px solid var(--border);
  font-size:12px;
  transition:background .15s;
  position:relative;
}
.time-block:hover{background:rgba(255,255,255,0.3);}
.tb-time{font-size:10px;letter-spacing:.06em;color:rgba(26,26,46,0.55);white-space:nowrap;margin-top:1px;min-width:44px;}
.tb-content{flex:1;}
.tb-title{font-weight:700;font-size:12px;}
.tb-sub{font-size:10px;color:rgba(26,26,46,0.55);font-style:italic;margin-top:1px;}
.tb-tag{
  font-size:9px;letter-spacing:.06em;text-transform:uppercase;
  padding:1px 6px;border-radius:99px;margin-top:3px;display:inline-block;
}
.tb-tag.exam{background:rgba(192,74,74,0.18);color:#8b3030;}
.tb-tag.holiday{background:rgba(74,138,106,0.18);color:#2a6644;}
.tb-tag.curriculum{background:rgba(74,127,165,0.18);color:#2a5a80;}
.tb-tag.orientation{background:rgba(160,120,60,0.18);color:#7a5420;}
.tb-tag.win{background:rgba(160,100,160,0.18);color:#6a3080;}
.tb-now{
  position:absolute;left:0;top:0;bottom:0;
  width:3px;background:rgba(224,92,48,0.7);border-radius:3px 0 0 3px;
}
.add-block-btn{
  font-family:var(--font);font-size:11px;letter-spacing:.07em;text-transform:uppercase;
  background:rgba(255,255,255,0.18);border:1px dashed rgba(255,255,255,0.4);
  border-radius:8px;padding:6px;width:100%;cursor:pointer;color:rgba(26,26,46,0.5);
  margin-top:.3rem;transition:all .15s;
}
.add-block-btn:hover{background:rgba(255,255,255,0.3);color:var(--ink);}

/* quick tasks col */
.task-list-mini{display:flex;flex-direction:column;gap:.3rem;}
.task-mini{
  display:flex;align-items:flex-start;gap:.5rem;
  padding:.45rem .6rem;border-radius:8px;
  background:rgba(255,255,255,0.18);border:1px solid var(--border);
  font-size:12px;cursor:pointer;transition:background .15s;
}
.task-mini:hover{background:rgba(255,255,255,0.3);}
.task-mini-cb{
  width:14px;height:14px;border-radius:4px;border:1.5px solid rgba(26,26,46,0.35);
  flex-shrink:0;margin-top:1px;display:flex;align-items:center;justify-content:center;
  transition:all .12s;
}
.task-mini-cb.done{background:rgba(26,26,46,0.5);border-color:transparent;}
.task-mini-cb.done::after{content:'✓';font-size:8px;color:#fff;}
.task-mini-text{flex:1;line-height:1.3;}
.task-mini-text.done{text-decoration:line-through;opacity:0.5;}
.task-mini-due{font-size:9px;color:rgba(26,26,46,0.5);white-space:nowrap;flex-shrink:0;}
.task-mini-due.overdue{color:#c04a4a;}
.no-tasks{font-size:12px;color:rgba(26,26,46,0.4);font-style:italic;padding:.5rem;}
.notion-sync-label{
  font-size:10px;letter-spacing:.06em;color:rgba(26,26,46,0.4);
  display:flex;align-items:center;gap:.35rem;margin-top:.5rem;
}
.sync-dot{width:6px;height:6px;border-radius:50%;background:#5a8f6a;animation:syncpulse 2s ease-in-out infinite;}
@keyframes syncpulse{0%,100%{opacity:1;}50%{opacity:0.3;}}

/* ══════════════════════════════════════
   § 3  TO-DO
══════════════════════════════════════ */
.todo-input-row{display:flex;gap:.5rem;margin-bottom:.8rem;}
.todo-input{
  flex:1;font-family:var(--font);font-size:13px;
  padding:.55rem .9rem;border-radius:10px;
  border:1px solid var(--border);background:rgba(255,255,255,0.2);
  backdrop-filter:blur(6px);color:var(--ink);outline:none;
  transition:border-color .15s,box-shadow .15s;
}
.todo-input::placeholder{color:rgba(26,26,46,0.4);font-style:italic;}
.todo-input:focus{border-color:rgba(255,255,255,0.5);box-shadow:0 0 0 3px rgba(255,255,255,0.15);}
.todo-add-btn{
  font-family:var(--font);font-size:17px;
  width:38px;height:38px;border-radius:10px;
  border:1px solid var(--border);background:rgba(255,255,255,0.25);
  color:var(--ink);cursor:pointer;transition:all .12s;
  display:flex;align-items:center;justify-content:center;
}
.todo-add-btn:hover{background:rgba(255,255,255,0.4);}

.todo-items{display:flex;flex-direction:column;gap:.3rem;}
.todo-item{
  display:flex;align-items:center;gap:.6rem;
  padding:.5rem .7rem;border-radius:9px;
  background:rgba(255,255,255,0.18);border:1px solid var(--border);
  font-size:13px;cursor:pointer;transition:all .15s;
  animation:slideIn .18s ease;
}
.todo-item:hover{background:rgba(255,255,255,0.3);}
.todo-item.removing{opacity:0;transform:translateX(12px);}
@keyframes slideIn{from{opacity:0;transform:translateY(-6px);}to{opacity:1;transform:translateY(0);}}
.todo-cb{
  width:17px;height:17px;border-radius:5px;
  border:1.5px solid rgba(26,26,46,0.3);
  display:flex;align-items:center;justify-content:center;
  flex-shrink:0;transition:all .12s;
}
.todo-cb.done{background:rgba(26,26,46,0.45);border-color:transparent;}
.todo-cb.done::after{content:'✓';font-size:9px;color:#fff;}
.todo-text{flex:1;}
.todo-text.done{text-decoration:line-through;opacity:0.5;}
.todo-del{
  font-size:11px;background:none;border:none;cursor:pointer;
  color:rgba(26,26,46,0.3);padding:2px 4px;border-radius:4px;
  opacity:0;transition:opacity .15s,color .15s;
}
.todo-item:hover .todo-del{opacity:1;}
.todo-del:hover{color:#c04a4a;}
.todo-empty{font-size:12px;color:rgba(26,26,46,0.4);font-style:italic;padding:.5rem 0;}
.todo-notion-bar{
  display:flex;align-items:center;justify-content:space-between;
  margin-top:.7rem;padding-top:.6rem;
  border-top:1px solid rgba(255,255,255,0.2);
  font-size:10px;color:rgba(26,26,46,0.45);
}
.push-notion-btn{
  font-family:var(--font);font-size:10px;letter-spacing:.07em;text-transform:uppercase;
  background:rgba(255,255,255,0.2);border:1px solid var(--border);
  border-radius:6px;padding:3px 10px;cursor:pointer;color:rgba(26,26,46,0.6);
  transition:all .15s;
}
.push-notion-btn:hover{background:rgba(255,255,255,0.35);color:var(--ink);}

/* ══════════════════════════════════════
   § 4  NOTION CALENDAR EVENTS
══════════════════════════════════════ */
.events-list{display:flex;flex-direction:column;gap:.4rem;}
.event-item{
  display:flex;align-items:flex-start;gap:.7rem;
  padding:.55rem .7rem;border-radius:9px;
  background:rgba(255,255,255,0.18);border:1px solid var(--border);
}
.event-date-badge{
  flex-shrink:0;text-align:center;
  min-width:36px;
}
.event-date-badge .edb-month{font-size:8px;letter-spacing:.08em;text-transform:uppercase;color:rgba(26,26,46,0.5);}
.event-date-badge .edb-day{font-size:18px;font-weight:700;line-height:1;}
.event-body{flex:1;}
.event-name{font-size:13px;font-weight:700;line-height:1.3;}
.event-tags{display:flex;flex-wrap:wrap;gap:.25rem;margin-top:.3rem;}
.events-empty{font-size:12px;color:rgba(26,26,46,0.4);font-style:italic;padding:.3rem 0;}

/* ══════════════════════════════════════
   § 5  VISTA ROADMAP
══════════════════════════════════════ */
.roadmap-wrap{
  display:grid;
  grid-template-columns:64px 2px 1fr;
  gap:0 0;
  position:relative;
}
.rm-date-col{grid-column:1;display:flex;flex-direction:column;}
.rm-spine-col{grid-column:2;position:relative;}
.rm-spine{
  position:absolute;left:0;top:0;bottom:0;width:2px;
  background:linear-gradient(to bottom,#4a7fa5 0%,#4a7fa5 33%,#4e8c65 33%,#4e8c65 66%,#7a5a92 66%,#7a5a92 100%);
  border-radius:2px;
}
.rm-items-col{grid-column:3;padding-left:14px;}

/* date label cells — aligned to rows via JS-set min-height */
.rm-date-cell{
  display:flex;flex-direction:column;align-items:flex-end;
  padding-right:10px;justify-content:flex-start;
  min-height:var(--cell-h,36px);
}
.rm-date-month{
  font-size:9px;letter-spacing:.08em;text-transform:uppercase;
  color:rgba(26,26,46,0.55);font-style:italic;line-height:1.3;
  text-align:right;margin-top:6px;white-space:nowrap;
}

.rm-phase{margin-bottom:1rem;}
.rm-phase-header{
  display:flex;align-items:center;gap:.6rem;
  margin-bottom:.6rem;
}
.rm-phase-dot{
  width:20px;height:20px;border-radius:50%;flex-shrink:0;
  border:2.5px solid #fff;display:flex;align-items:center;justify-content:center;
  font-size:8px;font-weight:700;color:#fff;z-index:2;
}
.rm-phase-title{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:#1a1a2e;}
.rm-phase-sub{font-size:10px;color:rgba(26,26,46,0.55);font-style:italic;}

.rm-item{
  display:flex;align-items:flex-start;gap:.6rem;
  margin-bottom:.4rem;
  padding:.4rem .5rem .4rem 0;
  border-radius:9px;cursor:pointer;transition:background .15s;
}
.rm-item:hover{background:rgba(255,255,255,0.2);}
.rm-node{
  width:13px;height:13px;border-radius:50%;flex-shrink:0;margin-top:3px;
  border:2px solid currentColor;background:rgba(255,255,255,0.6);z-index:2;
  display:flex;align-items:center;justify-content:center;transition:all .12s;
}
.rm-item.done .rm-node{background:currentColor;}
.rm-item.done .rm-node::after{content:'';width:3px;height:6px;border-right:1.5px solid #fff;border-bottom:1.5px solid #fff;transform:rotate(45deg) translate(-1px,-1px);display:block;}
.rm-item-body{flex:1;}
.rm-item-name{font-size:12.5px;font-weight:700;line-height:1.2;color:#1a1a2e;}
.rm-item-desc{font-size:11px;color:rgba(26,26,46,0.55);font-style:italic;margin-top:1px;}
.rm-item.done .rm-item-name{text-decoration:line-through;opacity:0.55;}

.rm-cp{
  display:flex;align-items:flex-start;gap:.6rem;
  margin-bottom:.4rem;
  padding:.4rem .5rem .4rem 0;
  border-radius:9px;cursor:pointer;transition:background .15s;
}
.rm-cp:hover{background:rgba(255,255,255,0.2);}
.rm-cp-node{
  width:16px;height:16px;border-radius:4px;flex-shrink:0;margin-top:2px;
  border:2px solid currentColor;background:rgba(255,255,255,0.6);z-index:2;
  display:flex;align-items:center;justify-content:center;transition:all .12s;
}
.rm-cp.done .rm-cp-node{background:currentColor;}
.rm-cp.done .rm-cp-node::after{content:'✓';font-size:8px;color:#fff;line-height:1;}
.rm-cp-name{font-size:12.5px;font-weight:700;color:#1a1a2e;}
.rm-cp-sub{font-size:11px;color:rgba(26,26,46,0.55);font-style:italic;margin-top:1px;}
.rm-cp.done .rm-cp-name{text-decoration:line-through;opacity:0.55;}

/* YOU ARE HERE */
.yah-wrap{margin-bottom:.4rem;}
.yah{
  display:inline-flex;align-items:center;gap:.45rem;
  background:rgba(224,92,48,0.85);color:#fff;
  font-size:10px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;
  padding:5px 12px 5px 8px;border-radius:99px;
  animation:yahpulse 2.5s ease-in-out infinite;
  backdrop-filter:blur(4px);
}
.yah-dot{width:7px;height:7px;border-radius:50%;background:#fff;animation:blink 1.2s ease-in-out infinite;}
@keyframes yahpulse{0%,100%{box-shadow:0 2px 12px rgba(224,92,48,0.4);}50%{box-shadow:0 2px 22px rgba(224,92,48,0.7);}}
@keyframes blink{0%,100%{opacity:1;}50%{opacity:0.25;}}
.yah-line{width:2px;height:18px;background:rgba(224,92,48,0.5);margin-left:8px;border-radius:2px;display:block;}

/* roadmap progress bar */
.rm-prog-wrap{margin-bottom:.8rem;}
.rm-prog-label{display:flex;justify-content:space-between;font-size:10px;letter-spacing:.07em;text-transform:uppercase;color:rgba(26,26,46,0.5);margin-bottom:.3rem;}
.rm-prog-track{height:4px;background:rgba(255,255,255,0.2);border-radius:99px;overflow:hidden;}
.rm-prog-fill{height:100%;border-radius:99px;background:rgba(255,255,255,0.6);transition:width .5s;}

/* ══════════════════════════════════════
   WEATHER SCENE SVG helpers
══════════════════════════════════════ */
</style>
</head>
<body>

<svg id="scene" style="position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:0;" viewBox="0 0 1000 600" preserveAspectRatio="xMidYMid slice" xmlns="http://www.w3.org/2000/svg"></svg>

<div class="dashboard">

  <!-- ── § 1 WEATHER + CLOCK ── -->
  <div class="card" id="weather-card">
    <div class="wc-grid">
      <div class="clock-block">
        <div class="clock-date" id="cl-date">—</div>
        <div class="clock-time" id="cl-time">—<span class="clock-ampm" id="cl-ampm"></span></div>
        <div class="clock-loc">Worcester, MA</div>
      </div>
      <div class="wc-divider"></div>
      <div class="weather-block">
        <svg id="wx-icon" width="60" height="60" viewBox="0 0 60 60" fill="none" xmlns="http://www.w3.org/2000/svg"></svg>
        <div>
          <span class="wx-temp" id="wx-temp">—</span>
          <span class="wx-desc" id="wx-desc">loading...</span>
        </div>
      </div>
    </div>
  </div>

  <!-- ── § 2 DAILY PLANNER ── -->
  <div class="card">
    <div class="card-label">daily planner</div>
    <div class="planner-nav">
      <div class="planner-nav-title" id="planner-title">Today</div>
      <div class="planner-nav-arrows">
        <button class="nav-btn" onclick="shiftWeek(-1)">‹</button>
        <button class="nav-btn" onclick="shiftWeek(0)">today</button>
        <button class="nav-btn" onclick="shiftWeek(1)">›</button>
      </div>
    </div>
    <div class="week-strip" id="week-strip"></div>
    <div class="planner-split">
      <div>
        <div class="planner-col-label">time blocks</div>
        <div class="time-blocks" id="time-blocks"></div>
        <button class="add-block-btn" onclick="addTimeBlock()">+ add block</button>
      </div>
      <div>
        <div class="planner-col-label">notion tasks due</div>
        <div class="task-list-mini" id="notion-tasks-mini"></div>
        <div class="notion-sync-label"><div class="sync-dot"></div>synced from notion</div>
      </div>
    </div>
  </div>

  <!-- ── § 3 TO-DO ── -->
  <div class="card">
    <div class="card-label">to-do</div>
    <div class="todo-input-row">
      <input class="todo-input" id="todo-input" type="text" placeholder="add a task..." maxlength="120">
      <button class="todo-add-btn" onclick="addTodo()">+</button>
    </div>
    <div class="todo-items" id="todo-items"></div>
    <div class="todo-empty" id="todo-empty" style="display:none">nothing yet.</div>
    <div class="todo-notion-bar">
      <span id="todo-sync-status">local</span>
      <button class="push-notion-btn" onclick="pushTodoToNotion()">push to notion</button>
    </div>
  </div>

  <!-- ── § 4 NOTION CALENDAR EVENTS ── -->
  <div class="card">
    <div class="card-label">upcoming — notion academic calendar</div>
    <div class="events-list" id="events-list"><div class="events-empty">loading events...</div></div>
    <div class="notion-sync-label" style="margin-top:.5rem"><div class="sync-dot"></div>synced from 2026-2027 academic calendar</div>
  </div>

  <!-- ── § 5 VISTA ROADMAP ── -->
  <div class="card">
    <div class="card-label">vista roadmap — umass chan class of 2030</div>
    <div class="rm-prog-wrap">
      <div class="rm-prog-label"><span>overall progress</span><span id="rm-pct">0%</span></div>
      <div class="rm-prog-track"><div class="rm-prog-fill" id="rm-fill" style="width:0%"></div></div>
    </div>
    <div class="roadmap-wrap">

function wxType(code,isNight){
  if(isNight&&code<=1)return'night';
  if(code<=1)return'clear'; if(code===2)return'partly'; if(code===3)return'cloudy';
  if(code===45||code===48)return'fog';
  if(code>=51&&code<=55)return'rain'; if(code>=61&&code<=65)return'rain';
  if(code>=71&&code<=75)return'snow'; if(code>=80&&code<=82)return'rain';
  if(code>=95)return'thunder'; return'cloudy';
}

async function notionAPI(endpoint, method='GET', body=null){
  const url = NOTION_PROXY + encodeURIComponent('https://api.notion.com/v1/'+endpoint);
  const opts = {
    method,
    headers:{'Content-Type':'application/json','X-Requested-With':'XMLHttpRequest'},
  };
  if(body) opts.body = JSON.stringify(body);
  const r = await fetch(url, opts);
  return r.json();
}

/* ═══════════════════════════════════════════
   WEEK STRIP + PLANNER STATE
═══════════════════════════════════════════ */
const TZ='America/New_York';
let plannerWeekOffset=0;
let selectedDate=getTodayET();
let calendarEvents=[]; /* from Notion */
let notionTasks=[];    /* from Notion */

function getTodayET(){
  return new Intl.DateTimeFormat('en-CA',{timeZone:TZ}).format(new Date()); /* YYYY-MM-DD */
}
function addDays(dateStr,n){
  const d=new Date(dateStr+'T12:00:00Z'); d.setUTCDate(d.getUTCDate()+n); return d.toISOString().slice(0,10);
}
function fmtMonthDay(dateStr){
  const d=new Date(dateStr+'T12:00:00Z');
  return d.toLocaleDateString('en-US',{month:'short',day:'numeric'});
}
function fmtWeekday(dateStr){
  return new Date(dateStr+'T12:00:00Z').toLocaleDateString('en-US',{weekday:'short'}).toUpperCase();
}
function fmtDay(dateStr){ return new Date(dateStr+'T12:00:00Z').getUTCDate(); }
function fmtMonth(dateStr){ return new Date(dateStr+'T12:00:00Z').toLocaleDateString('en-US',{month:'short'}); }

function shiftWeek(dir){
  if(dir===0){plannerWeekOffset=0;selectedDate=getTodayET();}
  else plannerWeekOffset+=dir;
  renderWeekStrip();
}

function renderWeekStrip(){
  const today=getTodayET();
  const baseDate=addDays(today, plannerWeekOffset*7);
  /* find monday of that week */
  const d=new Date(baseDate+'T12:00:00Z');
  const dow=d.getUTCDay(); /* 0=sun */
  const mondayDate=addDays(baseDate, dow===0?-6:1-dow);

  const strip=document.getElementById('week-strip');
  strip.innerHTML='';
  for(let i=0;i<7;i++){
    const date=addDays(mondayDate,i);
    const div=document.createElement('div');
    div.className='week-day'+(date===today?' today':'');
    const hasEv=calendarEvents.some(e=>e.date===date);
    if(hasEv) div.classList.add('has-event');
    div.innerHTML=`<div class="wd-name">${fmtWeekday(date)}</div><div class="wd-num">${fmtDay(date)}</div><div class="wd-month">${fmtMonth(date)}</div>`;
    div.onclick=()=>{selectedDate=date;renderTimeBlocks();renderNotionTasksMini();};
    if(date===selectedDate) div.style.background='rgba(255,255,255,0.4)';
    strip.appendChild(div);
  }
  const selDate=new Date(selectedDate+'T12:00:00Z');
  document.getElementById('planner-title').textContent=
    selDate.toLocaleDateString('en-US',{weekday:'long',month:'long',day:'numeric'});
}

/* ═══════════════════════════════════════════
   TIME BLOCKS (local storage)
═══════════════════════════════════════════ */
const TB_STORE='wc_timeblocks_v1';
let timeBlocks={};
function loadTB(){try{const d=localStorage.getItem(TB_STORE);if(d)timeBlocks=JSON.parse(d);}catch(e){}}
function saveTB(){localStorage.setItem(TB_STORE,JSON.stringify(timeBlocks));}

function renderTimeBlocks(){
  const wrap=document.getElementById('time-blocks');
  const blocks=(timeBlocks[selectedDate]||[]);
  /* also show Notion calendar events for this day */
  const evts=calendarEvents.filter(e=>e.date===selectedDate);
  wrap.innerHTML='';
  const nowH=parseInt(new Intl.DateTimeFormat('en-US',{timeZone:TZ,hour:'numeric',hour12:false}).format(new Date()));

  /* merge events + manual blocks */
  const all=[
    ...evts.map(e=>({time:'',title:e.name,sub:'',tag:e.tag,isNotion:true})),
    ...blocks
  ];
  if(all.length===0){
    wrap.innerHTML='<div style="font-size:12px;color:rgba(26,26,46,0.4);font-style:italic;padding:.3rem 0">no blocks yet.</div>';
    return;
  }
  all.forEach(b=>{
    const div=document.createElement('div');
    div.className='time-block';
    const isNow=b.time&&parseInt(b.time)===nowH;
    div.innerHTML=`
      ${isNow?'<div class="tb-now"></div>':''}
      <div class="tb-time">${b.time||'—'}</div>
      <div class="tb-content">
        <div class="tb-title">${b.title}</div>
        ${b.sub?`<div class="tb-sub">${b.sub}</div>`:''}
        ${b.tag?`<span class="tb-tag ${b.tag.toLowerCase()}">${b.tag}</span>`:''}
      </div>
      ${!b.isNotion?`<button onclick="deleteBlock('${selectedDate}',${blocks.indexOf(b)})" style="background:none;border:none;cursor:pointer;font-size:11px;color:rgba(26,26,46,0.3);opacity:0;transition:opacity .15s" onmouseenter="this.style.opacity=1" onmouseleave="this.style.opacity=0">✕</button>`:''}
    `;
    wrap.appendChild(div);
  });
}

function deleteBlock(date,idx){
  if(timeBlocks[date]) timeBlocks[date].splice(idx,1);
  saveTB();renderTimeBlocks();
}

function addTimeBlock(){
  const time=prompt('Time? (e.g. 9am, 2pm)','');
  if(time===null)return;
  const title=prompt('What? (e.g. Anki review)','');
  if(!title)return;
  const sub=prompt('Notes? (optional)','');
  if(!timeBlocks[selectedDate]) timeBlocks[selectedDate]=[];
  timeBlocks[selectedDate].push({time,title,sub:sub||''});
  saveTB();renderTimeBlocks();
}

function renderNotionTasksMini(){
  const wrap=document.getElementById('notion-tasks-mini');
  wrap.innerHTML='';
  const today=getTodayET();
  /* show tasks due on selectedDate or overdue */
  const filtered=notionTasks.filter(t=>{
    if(!t.due) return selectedDate===today; /* undated tasks show today */
    return t.due<=selectedDate;
  }).slice(0,6);
  if(filtered.length===0){
    wrap.innerHTML='<div class="no-tasks">all clear.</div>';return;
  }
  filtered.forEach(t=>{
    const div=document.createElement('div');
    div.className='task-mini';
    const overdue=t.due&&t.due<today;
    div.innerHTML=`
      <div class="task-mini-cb${t.done?' done':''}"></div>
      <div class="task-mini-text${t.done?' done':''}">${t.name}</div>
      ${t.due?`<div class="task-mini-due${overdue?' overdue':''}">${fmtMonthDay(t.due)}</div>`:''}
    `;
    wrap.appendChild(div);
  });
}

async function fetchNotionTasks(){
  try{
    const data=await notionAPI('databases/'+TASKS_DB+'/query','POST',{
      page_size:20,
      sorts:[{property:'Due',direction:'ascending'}]
    });
    if(data.results){
      notionTasks=data.results.map(p=>{
        const props=p.properties;
        const name=props['Task name']?.title?.[0]?.plain_text||props['Name']?.title?.[0]?.plain_text||'Untitled';
        const due=props['Due']?.date?.start||null;
        const status=props['Status']?.status?.name||'';
        const done=status==='Done'||status==='Complete';
        return{id:p.id,name,due,done,status};
      });
    }
  }catch(e){console.warn('Notion tasks fetch failed',e);}
  renderNotionTasksMini();
}

═══════════════════════════════════════════ */
async function fetchCalendarEvents(){
  try{
    const today=getTodayET();
    const data=await notionAPI('databases/'+CALENDAR_DB+'/query','POST',{
      page_size:20,
      filter:{property:'Date',date:{on_or_after:today}},
      sorts:[{property:'Date',direction:'ascending'}]
    });
    if(data.results){
      calendarEvents=data.results.map(p=>{
        const props=p.properties;
        const name=props['Name']?.title?.[0]?.plain_text||'Event';
        const date=props['Date']?.date?.start?.slice(0,10)||null;
        const tags=props['Tags']?.multi_select?.map(t=>t.name)||[];
        const tag=tags[0]||'';
        return{id:p.id,name,date,tag,tags};
      }).filter(e=>e.date);
    }
  }catch(e){console.warn('Calendar fetch failed',e);}
  renderCalendarEvents();
  renderWeekStrip();
  renderTimeBlocks();
}

function renderCalendarEvents(){
  const wrap=document.getElementById('events-list');
  wrap.innerHTML='';
  if(calendarEvents.length===0){
    wrap.innerHTML='<div class="events-empty">no upcoming events found.</div>';return;
  }
  calendarEvents.slice(0,8).forEach(e=>{
    const div=document.createElement('div');
    div.className='event-item';
    const tagClass=e.tag.toLowerCase().replace(/[^a-z]/g,'');
    div.innerHTML=`
      <div class="event-date-badge">
        <div class="edb-month">${e.date?fmtMonth(e.date):''}</div>
        <div class="edb-day">${e.date?fmtDay(e.date):'?'}</div>
      </div>
      <div class="event-body">
        <div class="event-name">${e.name}</div>
        <div class="event-tags">
          ${e.tags.map(t=>`<span class="tb-tag ${t.toLowerCase().replace(/[/& ]/g,'').substring(0,10)}">${t}</span>`).join('')}
        </div>
      </div>
    `;
    wrap.appendChild(div);
  });
}

/* ═══════════════════════════════════════════
   TO-DO (local + push to Notion)
═══════════════════════════════════════════ */
const TODO_STORE='wc_todo_v2';
let todos=[];
function loadTodos(){try{const d=localStorage.getItem(TODO_STORE);if(d)todos=JSON.parse(d);}catch(e){}}
function saveTodos(){localStorage.setItem(TODO_STORE,JSON.stringify(todos));}

function renderTodos(){
  const wrap=document.getElementById('todo-items');
  const empty=document.getElementById('todo-empty');
  wrap.innerHTML='';
  if(todos.length===0){empty.style.display='block';return;}
  empty.style.display='none';
  todos.forEach(t=>{
    const div=document.createElement('div');
    div.className='todo-item';
    div.dataset.id=t.id;
    div.innerHTML=`
      <div class="todo-cb${t.done?' done':''}"></div>
      <div class="todo-text${t.done?' done':''}">${t.text}</div>
      <button class="todo-del">✕</button>
    `;
    div.querySelector('.todo-cb').onclick=()=>{t.done=!t.done;saveTodos();renderTodos();};
    div.querySelector('.todo-text').onclick=()=>{t.done=!t.done;saveTodos();renderTodos();};
    div.querySelector('.todo-del').onclick=(e)=>{
      e.stopPropagation();
      div.classList.add('removing');
      setTimeout(()=>{todos=todos.filter(x=>x.id!==t.id);saveTodos();renderTodos();},200);
    };
    wrap.appendChild(div);
  });
}

function addTodo(){
  const inp=document.getElementById('todo-input');
  const text=inp.value.trim();
  if(!text)return;
  todos.unshift({id:Date.now(),text,done:false});
  inp.value='';saveTodos();renderTodos();
}

async function pushTodoToNotion(){
  const undone=todos.filter(t=>!t.done);
  if(undone.length===0){alert('No pending tasks to push.');return;}
  document.getElementById('todo-sync-status').textContent='pushing...';
  try{
    for(const t of undone){
      await notionAPI('pages','POST',{
        parent:{database_id:TASKS_DB},
        properties:{
          'Task name':{title:[{text:{content:t.text}}]},
          'Status':{status:{name:'Not started'}}
        }
      });
    }
    document.getElementById('todo-sync-status').textContent='pushed ✓';
    setTimeout(()=>{document.getElementById('todo-sync-status').textContent='local';fetchNotionTasks();},2000);
  }catch(e){
    document.getElementById('todo-sync-status').textContent='push failed';
    console.error(e);
  }
}

document.getElementById('todo-input').addEventListener('keydown',e=>{if(e.key==='Enter')addTodo();});

/* YAH auto-advances to sit just before the first unchecked item/cp */
function getYAHAfter(){
  for(let i=0;i<ROADMAP.length;i++){
    const item=ROADMAP[i];
    if((item.type==='item'||item.type==='cp')&&!rmDone(item.id)){
      return i===0?null:ROADMAP[i-1].id;
    }
  }
  return ROADMAP[ROADMAP.length-1].id;
}

function buildRoadmap(){
  loadRM();
  const itemsCol=document.getElementById('roadmap');
  const dateCol=document.getElementById('rm-date-col');
  itemsCol.innerHTML='';dateCol.innerHTML='';

  const yahAfter=getYAHAfter();
  let yahInserted=false;
  let lastMonth='';

  ROADMAP.forEach((item,idx)=>{
    /* insert YAH after whichever item is yahAfter */
    if(!yahInserted && yahAfter!==null && idx>0 && ROADMAP[idx-1].id===yahAfter){
      dateCol.appendChild(Object.assign(document.createElement('div'),{className:'rm-date-cell'}));
      const yah=document.createElement('div');
      yah.className='yah-wrap';
      yah.innerHTML=`<div class="yah"><div class="yah-dot"></div>you are here</div><div class="yah-line"></div>`;
      itemsCol.appendChild(yah);
      yahInserted=true;
    }
    /* insert YAH at very top if nothing done yet */
    if(!yahInserted && yahAfter===null && idx===0){
      dateCol.appendChild(Object.assign(document.createElement('div'),{className:'rm-date-cell'}));
      const yah=document.createElement('div');
      yah.className='yah-wrap';
      yah.innerHTML=`<div class="yah"><div class="yah-dot"></div>you are here</div><div class="yah-line"></div>`;
      itemsCol.appendChild(yah);
      yahInserted=true;
    }

    /* date cell — show month only when it changes */
    const dc=document.createElement('div');
    dc.className='rm-date-cell';
    if(item.month&&item.month!==lastMonth){
      lastMonth=item.month;
      dc.innerHTML=`<div class="rm-date-month">${item.month}</div>`;
    }
    dateCol.appendChild(dc);

    if(item.type==='phase'){
      const div=document.createElement('div');
      div.className='rm-phase';div.id='rmrow-'+item.id;
      div.innerHTML=`<div class="rm-phase-header"><div class="rm-phase-dot" style="background:${item.color};box-shadow:0 0 0 2.5px ${item.color}"></div><div><div class="rm-phase-title" style="color:${item.color}">${item.title}</div><div class="rm-phase-sub">${item.sub}</div></div></div>`;
      itemsCol.appendChild(div);
    } else if(item.type==='item'){
      const done=rmDone(item.id);
      const div=document.createElement('div');
      div.className='rm-item'+(done?' done':'');div.id='rmrow-'+item.id;div.style.color=item.color;
      div.innerHTML=`<div class="rm-node" style="color:${item.color}"></div><div class="rm-item-body"><div class="rm-item-name">${item.name}</div><div class="rm-item-desc">${item.desc}</div></div>`;
      div.onclick=()=>{rmToggle(item.id);buildRoadmap();};
      itemsCol.appendChild(div);
    } else if(item.type==='cp'){
      const done=rmDone(item.id);
      const div=document.createElement('div');
      div.className='rm-cp'+(done?' done':'');div.id='rmrow-'+item.id;div.style.color=item.color;
      div.innerHTML=`<div class="rm-cp-node" style="color:${item.color}"></div><div><div class="rm-cp-name">${item.name}</div><div class="rm-cp-sub">${item.sub}</div></div>`;
      div.onclick=()=>{rmToggle(item.id);buildRoadmap();};
      itemsCol.appendChild(div);
    }
  });

  /* if everything is done, YAH at the bottom */
  if(!yahInserted){
    dateCol.appendChild(Object.assign(document.createElement('div'),{className:'rm-date-cell'}));
    const yah=document.createElement('div');yah.className='yah-wrap';
    yah.innerHTML=`<div class="yah"><div class="yah-dot"></div>you are here</div>`;
    itemsCol.appendChild(yah);
  }

  /* align date cell heights to their corresponding item rows */
  requestAnimationFrame(()=>{
    const dateCells=Array.from(dateCol.querySelectorAll('.rm-date-cell'));
    const itemRows=Array.from(itemsCol.children).filter(r=>!r.classList.contains('yah-wrap'));
    itemRows.forEach((row,i)=>{
      if(dateCells[i]) dateCells[i].style.minHeight=row.getBoundingClientRect().height+'px';
    });
  });

  updateRMProgress();
}

function updateRMProgress(){
  const items=ROADMAP.filter(x=>x.type==='item'||x.type==='cp');
  const done=items.filter(x=>rmDone(x.id)).length;
  const pct=items.length?Math.round(done/items.length*100):0;
  document.getElementById('rm-pct').textContent=pct+'%';
  document.getElementById('rm-fill').style.width=pct+'%';
}
